<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: GPL-2.0-or-later -->
<!--
  The fixture is deliberately awkward, because a convenient one cannot fail.

  Nearly every geometric query has a coordinate system that the SVG specification names and
  that Inkscape's internal answer differs from: document coordinates carry every ancestor
  transform, SVG's user space carries none. In a document with no transforms those are the
  same numbers, so a test written against such a document passes whichever one the host
  returns. It is not testing the behaviour, it is agreeing with it.

  The same applies elsewhere. Only translations were used at first, so a scale error was
  invisible. Only hex colours, so resolving a named colour was never exercised. No nested
  viewport, so "document" and "viewport" could not be told apart. Every one of those was a
  place where the test could not fail for the reason it existed.

  So: transforms that scale as well as translate, a nested viewport, colours in three
  notations, an inherited style, and text that is not at the origin.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="400" height="400" viewBox="0 0 400 400">

  <!-- Scale as well as translate: with translation alone, a host that forgot to apply the
       scale would still produce the right numbers. -->
  <!-- The rect carries its own transform on top of the group's, so "the element's own user
       space" is distinguishable from both its parent's and the document's.

       Note the comments sit OUTSIDE the group. firstChild and childNodes are defined over
       nodes, not elements, so a comment inside would be the group's first child and would
       change its child count. That is correct DOM behaviour and the tests assert it, so the
       fixture keeps its commentary where it does not alter the structure being described. -->
  <g id="group" transform="translate(100,50) scale(2)">
    <rect id="box" x="10" y="20" width="30" height="40" transform="translate(7,3)"
          style="fill:#ff0000;stroke:#000000;stroke-width:4"/>

    <path id="line" d="M 0,0 L 100,0" style="fill:none;stroke:#000000;stroke-width:2"/>

    <text id="label" x="10" y="150" style="font-size:16px">Hello</text>
  </g>

  <!-- A nested viewport. getCTM is defined against the nearest one, not the document, and
       those differ only when a document has one. -->
  <svg id="inner" x="200" y="200" width="100" height="100" viewBox="0 0 50 50">
    <rect id="nested" x="5" y="5" width="10" height="10" style="fill:#00ff00"/>
  </svg>

  <!-- Colour written three ways, and one inherited rather than declared. A computed style
       is supposed to resolve all four to the same notation; a specified style hands each
       back as written, which is how the difference shows up. -->
  <g id="painted" style="fill:rebeccapurple">
    <rect id="named"    x="0" y="300" width="10" height="10" style="fill:rebeccapurple"/>
    <rect id="functional" x="20" y="300" width="10" height="10" style="fill:rgb(102,51,153)"/>
    <rect id="hex"      x="40" y="300" width="10" height="10" style="fill:#663399"/>
    <rect id="inherited" x="60" y="300" width="10" height="10"/>
  </g>

  <!-- Lookup and identity. Deliberately NOT inside <g id="group">, whose child count three
       separate cases assert, and nowhere near (9000,9000), where a hit test asserts that
       nothing is found. Adding to a shared fixture means checking what already reads it. -->
  <defs>
    <linearGradient id="grad">
      <stop offset="0" style="stop-color:#000000"/>
      <stop offset="1" style="stop-color:#ffffff"/>
    </linearGradient>
    <clipPath id="clip"><circle cx="5" cy="5" r="5"/></clipPath>
    <mask id="msk"><circle cx="5" cy="5" r="5" style="fill:#ffffff"/></mask>
    <marker id="arrow" refX="0" refY="0" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0,-2 L 4,0 L 0,2 Z"/>
    </marker>
    <!-- A live path effect, so pathEffects has a non-empty case to answer. The markup shape
         is taken from testfiles/lpe_tests/Inkscape_0_92_64.svg rather than invented; "offset"
         is a registered key (live_effects/effect.cpp) and is used here because it changes the
         geometry unconditionally. Effects that only reshape smooth nodes (bspline, spiro) and
         ones that need a linked path (bounding_box) were tried first and are all no-ops on
         plain rectangular input, which left the before and after answers identical. -->
    <inkscape:path-effect effect="offset" id="pe-offset" is_visible="true"
                          offset="5" unit="px" linejoin_type="miter" miter_limit="4"/>
  </defs>

  <!-- Referenced resources, as PATHS rather than rects: cover-lookup asserts an exact rect
       count, so anything added here has to stay out of that total. -->
  <g id="referencing">
    <path id="clipped"     d="M 200,350 h 10 v 10 h -10 z" clip-path="url(#clip)"/>
    <path id="masked"      d="M 220,350 h 10 v 10 h -10 z" mask="url(#msk)"/>
    <path id="marked-path" d="M 240,350 L 260,350" style="stroke:#000000" marker-end="url(#arrow)"/>
    <!-- Two overlapping and two disjoint shapes, so a boolean operation has both a non-empty
         and an empty answer to produce, and a collision test has both outcomes to find. -->
    <path id="overlapA" d="M 0,400 h 40 v 40 h -40 z"/>
    <path id="overlapB" d="M 20,420 h 40 v 40 h -40 z"/>
    <path id="apartC"   d="M 200,400 h 10 v 10 h -10 z"/>
    <!-- Two segments that cross exactly once, at (150,415). -->
    <path id="crossX" d="M 140,415 L 160,415"/>
    <path id="crossY" d="M 150,405 L 150,425"/>
    <!-- The SAME geometry under the two fill rules: a square with a smaller square inside it,
         wound the same way. Under even-odd the inner square is a hole; under nonzero it is
         filled. Every boolean and offset operation takes a fill rule, so an implementation
         that hardcodes one produces a plausible WRONG answer for one of these and no answer
         differs enough to notice. That is exactly what happened, and these two exist so it
         cannot happen silently again. -->
    <path id="donutEven"    d="M 0,500 h 60 v 60 h -60 z M 20,520 h 20 v 20 h -20 z"
          style="fill-rule:evenodd"/>
    <!-- Crosses itself exactly once, which is what makes "a rectangle does not" mean
         something. Self-intersection is a different question from one path meeting another,
         and the one worth asking before a boolean operation. -->
    <path id="bowtie" d="M 100,500 L 160,560 L 160,500 L 100,560 Z" style="fill:#888888"/>
    <path id="donutNonzero" d="M 0,500 h 60 v 60 h -60 z M 20,520 h 20 v 20 h -20 z"
          style="fill-rule:nonzero"/>
    <!-- Two LPE items, because pathData and pathDataBeforeLPE differ for one kind and
         are identical for the other. That is a property of Inkscape, not of this API:
         curve_for_item returns the path BEFORE the effect when the item is an SPPath and the
         path AFTER it for every other SPShape, while curve_for_item_before_LPE always returns
         the input (path-util.cpp curve_for_item()).

         Worth knowing when reading the saved file: Inkscape rewrites an LPE-bearing <rect> as
         <path sodipodi:type="rect">. The repr name becomes svg:path, so getElementsByTagName
         counts it as a path, while the OBJECT is still an SPRect and therefore takes the
         non-SPPath branch above. Both facts are asserted, in cover-lookup and cover-path. -->
    <rect id="effected" x="300" y="400" width="20" height="20"
          inkscape:path-effect="#pe-offset"/>
    <path id="effected-path" d="M 340,400 L 360,400 L 360,420 L 340,420 Z"
          inkscape:original-d="M 340,400 L 360,400 L 360,420 L 340,420 Z"
          inkscape:path-effect="#pe-offset"/>
  </g>

  <!-- Two lines, so line counting and baseline collection have more than one of each to find.
       sodipodi:role="line" is what makes a tspan a LINE rather than a positioned run: Inkscape
       does its own line layout for classic text and keys it off that attribute
       (sp-text.cpp SPText line layout). Tspans with differing y and no role are one line with two runs. -->
  <text id="multiline" x="300" y="300" style="font-size:10px"><tspan
      sodipodi:role="line" x="300" y="300">One</tspan><tspan
      sodipodi:role="line" x="300" y="312" style="fill:#00ff00">Two</tspan></text>

  <g id="meta">
    <rect id="tagged"        class="marked" x="100" y="350" width="10" height="10"/>
    <rect id="hidden-rect"   x="120" y="350" width="10" height="10" style="display:none"/>
    <rect id="locked-rect"   x="140" y="350" width="10" height="10" sodipodi:insensitive="true"/>
    <rect id="gradient-user" x="160" y="350" width="10" height="10" style="fill:url(#grad)"/>
    <!-- title and desc are CHILD ELEMENTS, not attributes, which is why reading them needs
         host support at all. -->
    <rect id="described"     x="180" y="350" width="10" height="10">
      <title>A title</title>
      <desc>A description</desc>
    </rect>
  </g>

  <!-- The display unit is declared rather than left to Inkscape's default, so the test for
       it asserts something this file states instead of something the build happens to do.
       The `inkscape` prefix is bound on the root element, which is where Inkscape itself
       writes it. Binding it on this element instead is valid XML that the repr layer does not
       pick up, so the attribute would be carried and silently ignored. -->
  <sodipodi:namedview id="namedview" inkscape:document-units="mm"/>
</svg>
