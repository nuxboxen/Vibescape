<?xml version="1.0" encoding="UTF-8"?>
<!--
  Symbolic icon for feSpectralNoise. Single-color (theme-tinted)
  abstract glyph: a 4x4 grid of dots with size variation suggesting
  the spectral falloff that distinguishes this primitive from the
  uniform-amplitude Perlin output of feTurbulence.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="#000000">
  <!-- Frame -->
  <rect x="1" y="1" width="14" height="14" fill="none" stroke="#000000" stroke-width="0.7"/>
  <!-- Pink-noise-like dot grid: amplitude varies with notional 1/√λ -->
  <circle cx="3.5" cy="3.5"  r="0.9"/>
  <circle cx="6.5" cy="3.5"  r="1.1"/>
  <circle cx="9.5" cy="3.5"  r="0.7"/>
  <circle cx="12.5" cy="3.5" r="1.0"/>
  <circle cx="3.5" cy="6.5"  r="1.0"/>
  <circle cx="6.5" cy="6.5"  r="0.6"/>
  <circle cx="9.5" cy="6.5"  r="1.2"/>
  <circle cx="12.5" cy="6.5" r="0.8"/>
  <circle cx="3.5" cy="9.5"  r="0.8"/>
  <circle cx="6.5" cy="9.5"  r="1.1"/>
  <circle cx="9.5" cy="9.5"  r="0.7"/>
  <circle cx="12.5" cy="9.5" r="1.0"/>
  <circle cx="3.5" cy="12.5" r="1.1"/>
  <circle cx="6.5" cy="12.5" r="0.7"/>
  <circle cx="9.5" cy="12.5" r="1.0"/>
  <circle cx="12.5" cy="12.5" r="0.9"/>
</svg>
