<?xml version="1.0" encoding="UTF-8"?>
<!--
  Symbolic icon for feSpectralBilateral. A sharp vertical edge with
  small smoothing curves around it, suggesting "edge stays sharp,
  flat regions get smoothed."
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="#000000">
  <!-- Frame -->
  <rect x="1" y="1" width="14" height="14" fill="none" stroke="#000000" stroke-width="0.7"/>
  <!-- Sharp central edge — preserved -->
  <rect x="7.5" y="2.5" width="1" height="11"/>
  <!-- Wavy smoothing curves on each side suggesting interior diffusion -->
  <path d="M 3 5 Q 4 4.2 5 5 T 7 5" fill="none" stroke="#000000" stroke-width="0.7"/>
  <path d="M 3 8 Q 4 7.2 5 8 T 7 8" fill="none" stroke="#000000" stroke-width="0.7"/>
  <path d="M 3 11 Q 4 10.2 5 11 T 7 11" fill="none" stroke="#000000" stroke-width="0.7"/>
  <path d="M 9 5 Q 10 5.8 11 5 T 13 5" fill="none" stroke="#000000" stroke-width="0.7"/>
  <path d="M 9 8 Q 10 8.8 11 8 T 13 8" fill="none" stroke="#000000" stroke-width="0.7"/>
  <path d="M 9 11 Q 10 11.8 11 11 T 13 11" fill="none" stroke="#000000" stroke-width="0.7"/>
</svg>
