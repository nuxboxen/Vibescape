<?xml version="1.0" encoding="UTF-8"?>
<!--
  Symbolic icon for feSpectralDistance. A solid disk surrounded by
  three concentric rings — visualizes the "distance from boundary"
  isolines a heat-kernel SDF computes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="#000000">
  <rect x="1" y="1" width="14" height="14" fill="none" stroke="#000000" stroke-width="0.7"/>
  <!-- Solid central disk: the source mask -->
  <circle cx="8" cy="8" r="2"/>
  <!-- Three isolines: d = σ, 2σ, 3σ -->
  <circle cx="8" cy="8" r="3.5" fill="none" stroke="#000000" stroke-width="0.5"/>
  <circle cx="8" cy="8" r="5"   fill="none" stroke="#000000" stroke-width="0.5"/>
  <circle cx="8" cy="8" r="6.5" fill="none" stroke="#000000" stroke-width="0.4"/>
</svg>
